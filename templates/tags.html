{% extends "base.html" %}

{% block title %}Tags - {{ SITENAME }}{% endblock %}

{% block content %}
    <header class="mb-8 px-8">
        <h1 class="text-3xl font-bold font-serif text-gray-900 dark:text-white">Tags</h1>
    </header>

    <div class="bg-white dark:bg-gray-900 shadow-md rounded-sm border border-gray-200 dark:border-gray-800 p-6 sm:p-8">
        <ul class="flex flex-wrap gap-3">
            {% for tag, articles in tags|sort %}
                <li>
                    <a href="{{ SITEURL }}/{{ tag.url }}" class="inline-block px-4 py-2 bg-gray-100 dark:bg-gray-800 hover:bg-blue-50 dark:hover:bg-blue-900/30 text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 rounded-full transition-colors">
                        <span class="font-medium">{{ tag }}</span>
                        <span class="ml-1 text-xs text-gray-500 dark:text-gray-500 align-super">{{ articles|count }}</span>
                    </a>
                </li>
            {% endfor %}
        </ul>
    </div>
{% endblock %}
